[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryai-resilience-v2"
version = "0.2.0"
description = "Failure-aware LLM-AutoML research pipeline for resilient industrial decision support"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "pydantic>=2.11,<3",
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
